# render.yaml
services:
  # Service 1: API Flask
  - type: web
    name: spam-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python api/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
    plan: free

  # Service 2: Interface Streamlit  
  - type: web
    name: spam-ui
    runtime: python
    buildCommand: pip install -r requirements_streamlit.txt
    startCommand: streamlit run app_streamlit.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PORT
        value: 8501
    plan: free